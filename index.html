<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RekapData</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Sans-Serif Modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="light">
  <div class="mobile-container">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-badge">FC</span>
        <h1>RekapData</h1>
      </div>
      <button id="themeToggleBtn" type="button" aria-label="Toggle Theme" class="btn-icon">
        <span id="themeIcon">🌙</span>
      </button>
    </header>

    <!-- Navigasi Tab -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tab-checkin">Check-in</button>
      <button class="tab-btn" data-tab="tab-rekap">Rekap Data</button>
      <button class="tab-btn" data-tab="tab-cetak">Cetak</button>
    </nav>

    <!-- Konten Utama -->
    <main class="tab-content">
      
      <!-- TAB 1: FORM CHECK-IN -->
      <section id="tab-checkin" class="tab-pane active">
        <form id="checkinForm">
          <!-- Identitas Unit -->
          <div class="card">
            <h2 class="card-title">Identitas Kendaraan</h2>
            <div class="form-group">
              <label for="nopolInput">Nomor Polisi (Nopol)</label>
              <input type="text" id="nopolInput" placeholder="B 1234 ABC" required>
            </div>
            <div class="form-group">
              <label for="checkinDate">Tanggal & Waktu</label>
              <input type="datetime-local" id="checkinDate" required>
            </div>
            <div class="form-group">
              <label for="checkerName">Nama Checker</label>
              <input type="text" id="checkerName" placeholder="Nama Petugas" required>
            </div>
            <div class="form-group">
              <label for="odometer">Odometer (KM)</label>
              <input type="number" id="odometer" placeholder="0" min="0" required>
            </div>
          </div>

          <!-- Kategori Checklist: Mesin -->
          <div class="card">
            <h2 class="card-title">Bagian Mesin</h2>
            <div id="checklist-mesin" class="checklist-group"></div>
          </div>

          <!-- Kategori Checklist: Depan -->
          <div class="card">
            <h2 class="card-title">Bagian Depan</h2>
            <div id="checklist-depan" class="checklist-group"></div>
          </div>

          <!-- Kategori Checklist: Samping -->
          <div class="card">
            <h2 class="card-title">Bagian Samping (Kiri & Kanan)</h2>
            <div id="checklist-samping" class="checklist-group"></div>
          </div>

          <!-- Kategori Checklist: Belakang -->
          <div class="card">
            <h2 class="card-title">Bagian Belakang</h2>
            <div id="checklist-belakang" class="checklist-group"></div>
          </div>

          <!-- Dokumentasi Foto -->
          <div class="card">
            <h2 class="card-title">Dokumentasi Foto Terbaru</h2>
            <div class="upload-wrapper">
              <input type="file" id="fotoInput" accept="image/*" capture="environment" class="file-input">
              <div id="previewContainer" class="preview-box hidden">
                <img id="imagePreview" alt="Preview Foto">
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btnSubmit" class="btn btn-primary full-width">
            Simpan Check-in
          </button>
        </form>
      </section>

      <!-- TAB 2: REKAP DATA -->
      <section id="tab-rekap" class="tab-pane">
        <div class="card">
          <div class="form-group">
            <input type="text" id="searchKeyword" placeholder="Cari Nopol atau Checker...">
          </div>
          <div class="filter-grid">
            <select id="filterStatus">
              <option value="ALL">Semua Kondisi</option>
              <option value="AMAN">Hanya Aman</option>
              <option value="PERBAIKAN">Perlu Perbaikan</option>
            </select>
            <input type="date" id="filterDate">
          </div>
        </div>
        <div id="rekapList" class="rekap-container">
          <!-- Kartu riwayat akan digenerate dinamis oleh JS -->
        </div>
      </section>

      <!-- TAB 3: CETAK LAPORAN -->
      <section id="tab-cetak" class="tab-pane">
        <div class="card">
          <h2 class="card-title">Ekspor & Cetak Laporan</h2>
          <p class="text-muted">Pilih dokumen inspeksi yang ingin dicetak langsung ke PDF atau printer fisik.</p>
          <div class="form-group mt-3">
            <label for="selectUnitCetak">Pilih Kendaraan:</label>
            <select id="selectUnitCetak"></select>
          </div>
          <button type="button" id="btnPrintUnit" class="btn btn-primary full-width mt-2">Cetak Lembar Unit</button>
        </div>
      </section>

    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModalBtn" class="modal-close">&times;</span>
        <h3 id="modalNopol" class="modal-title"></h3>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

  </div>

  <!-- Template Cetak (Hanya Muncul Saat Mode Print) -->
  <div id="printableArea" class="print-only"></div>

  <script src="script.js"></script>
</body>
</html>
